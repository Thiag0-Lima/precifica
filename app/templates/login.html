<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — PRECIFICA</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 40px 32px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        .login-box h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 0.05em;
        }
        .login-box p {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 28px;
        }
        .login-box .form-group {
            margin-bottom: 20px;
        }
        .login-box .btn {
            width: 100%;
            justify-content: center;
            padding: 12px;
        }
        .erro {
            background: #f8d7da;
            color: #721c24;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 16px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>PRECIFICA</h1>
        <p>Acesso restrito</p>

        {% if erro %}
        <div class="erro">{{ erro }}</div>
        {% endif %}

        <form method="post" action="/login">
            <div class="form-group">
                <label>Senha</label>
                <input type="password" name="password" required autofocus placeholder="Digite a senha">
            </div>
            <button type="submit" class="btn btn-primary">Entrar</button>
        </form>
    </div>
</body>
</html>
